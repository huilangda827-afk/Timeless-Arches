<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>斗拱关卡校准器 · Calibrator</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #1e1816; color: #e8dcc8; }
    #app { position: fixed; inset: 0; }
    #panel {
      position: fixed; top: 16px; left: 16px;
      width: 360px; max-height: calc(100vh - 32px); overflow-y: auto;
      background: rgba(28, 22, 18, 0.92); border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 10px; padding: 16px 18px; backdrop-filter: blur(8px); z-index: 100;
      font-size: 13px; line-height: 1.55;
    }
    #panel h1 { margin: 0 0 6px; font-size: 16px; color: #ffd24a; letter-spacing: 1px; }
    #panel h2 { margin: 14px 0 6px; font-size: 13px; color: #c8a063; letter-spacing: 1px; border-bottom: 1px solid rgba(255,215,0,0.15); padding-bottom: 4px; }
    .row { margin-bottom: 8px; }
    label { display: block; color: #a89070; font-size: 11px; margin-bottom: 2px; }
    input[type="text"], input[type="file"], textarea {
      width: 100%; background: #2c211c; border: 1px solid rgba(255,215,0,0.18);
      color: #e8dcc8; padding: 6px 8px; border-radius: 4px; font-size: 12px; font-family: monospace;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      background: linear-gradient(180deg, #b91c1c 0%, #8a1010 100%);
      color: #fff; border: 1px solid rgba(255,215,0,0.4); border-radius: 5px;
      padding: 7px 14px; font-size: 12px; cursor: pointer; letter-spacing: 1px;
    }
    button:hover { background: linear-gradient(180deg, #d12626 0%, #a81212 100%); }
    button.ghost { background: transparent; border-color: rgba(255,215,0,0.3); color: #ffd24a; }
    button.ghost:hover { background: rgba(255,215,0,0.1); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .piece-row {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      background: #2c211c; border-radius: 4px; margin-bottom: 4px; cursor: pointer;
      transition: background 0.15s; border: 1px solid transparent;
    }
    .piece-row:hover { background: #3a2c24; }
    .piece-row.selected { background: rgba(255, 215, 0, 0.18); border-color: rgba(255,215,0,0.5); }
    .piece-row.hidden-piece { opacity: 0.45; }
    .piece-row .eye { width: 22px; text-align: center; font-size: 14px; flex-shrink: 0; user-select: none; }
    .piece-row .name { flex: 1; font-weight: 500; }
    .piece-row .pos { font-size: 10px; color: #a89070; font-family: monospace; }
    .controls-tip { font-size: 11px; color: #a89070; margin-top: 6px; line-height: 1.6; }
    .controls-tip kbd {
      background: #3a2c24; border: 1px solid rgba(255,215,0,0.2); border-radius: 3px;
      padding: 1px 5px; font-family: monospace; font-size: 10px; color: #ffd24a;
    }
    #export-output { margin-top: 8px; }
    .status-msg { font-size: 11px; color: #88c87a; margin-top: 4px; min-height: 14px; }
    .status-err { color: #e87878; }
    /* 精调面板 */
    .tweak-row { display: flex; align-items: center; gap: 3px; margin-bottom: 3px; font-size: 11px; }
    .tweak-label { width: 50px; color: #a89070; font-size: 10px; flex-shrink: 0; }
    .tweak-axis { width: 14px; color: #ffd24a; font-weight: 700; text-align: center; flex-shrink: 0; }
    .tweak-row input { width: 60px; padding: 3px 5px; font-size: 11px; text-align: center; }
    .tweak-row button {
      padding: 3px 6px; font-size: 10px; min-width: 28px; letter-spacing: 0;
      background: #3a2c24; border-color: rgba(255,215,0,0.18); color: #e8dcc8;
    }
    .tweak-row button:hover { background: #4a3830; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="panel">
    <h1>关卡校准器</h1>
    <div style="font-size: 11px; color: #a89070; margin-bottom: 8px;">
      整体建模成品 → 拖动零件对齐 → 导出 targetOverrides JSON
    </div>

    <h2>1. 加载整体成品（参照）</h2>
    <div class="row">
      <label>成品 GLB 路径（相对 public/）</label>
      <input type="text" id="ghost-path" placeholder="/models/level2/宋金官府.glb" value="/models/level2/宋金官府.glb" />
    </div>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
      <button id="btn-load-ghost">加载成品参照</button>
      <button id="btn-toggle-ghost" class="ghost" style="font-size:11px;padding:4px 10px;">隐藏成品 (G)</button>
      <span class="status-msg" id="status-ghost" style="flex-basis:100%;"></span>
    </div>

    <h2>2. 加载零件（可拖动）</h2>
    <div class="row">
      <label>零件名（每行一个，对应 /models/level2/{名}.glb）</label>
      <textarea id="piece-list" placeholder="组件集合壹&#10;...">组件集合壹
组件集合贰
组件集合叁
组件集合肆
组件集合伍
组件集合陆</textarea>
    </div>
    <div class="row">
      <label>路径前缀</label>
      <input type="text" id="piece-prefix" value="/models/level2/" />
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#e8dcc8;font-size:11px;">
        <input type="checkbox" id="keep-glb-position" />
        <span>保留 GLB 自带位置（仅在组员已按装配位置导出时勾选 · 否则零件会全堆在原点）</span>
      </label>
    </div>
    <div class="row">
      <button id="btn-load-pieces">加载所有零件</button>
      <span class="status-msg" id="status-pieces"></span>
    </div>

    <h2>3. 点击名字显示 / 选中零件</h2>
    <div style="font-size:10px;color:#a89070;margin-bottom:6px;">
      加载后全部隐藏 · 点名字 → 显示并选中 · 再点👁隐藏 · 可同时显示多个
    </div>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap;">
      <button id="btn-show-all" class="ghost" style="font-size:11px;padding:4px 10px;">全部显示</button>
      <button id="btn-hide-all" class="ghost" style="font-size:11px;padding:4px 10px;">全部隐藏</button>
      <button id="btn-isolate" class="ghost" style="font-size:11px;padding:4px 10px;">仅显示选中</button>
      <button id="btn-park" class="ghost" style="font-size:11px;padding:4px 10px;">选中→工作台 (5,2,0)</button>
      <button id="btn-origin" class="ghost" style="font-size:11px;padding:4px 10px;">选中→原点</button>
    </div>
    <div id="piece-list-ui"></div>

    <!-- 精调面板：选中零件后通过数值输入直接控制位置/旋转/缩放，不依赖 gizmo -->
    <div id="tweak-panel" style="display:none;margin-top:10px;padding:8px;border:1px solid rgba(255,215,0,0.3);border-radius:5px;background:#241915;">
      <div style="font-size:11px;color:#c8a063;margin-bottom:6px;font-weight:600;">精调当前选中零件</div>
      <div class="tweak-row" data-axis="position">
        <span class="tweak-label">位置 (m)</span>
        <span class="tweak-axis">X</span><button data-step="-0.5">-0.5</button><button data-step="-0.1">-</button><input id="tw-px" type="number" step="0.1"/><button data-step="0.1">+</button><button data-step="0.5">+0.5</button>
      </div>
      <div class="tweak-row">
        <span class="tweak-label"></span>
        <span class="tweak-axis">Y</span><button data-step="-0.5">-0.5</button><button data-step="-0.1">-</button><input id="tw-py" type="number" step="0.1"/><button data-step="0.1">+</button><button data-step="0.5">+0.5</button>
      </div>
      <div class="tweak-row">
        <span class="tweak-label"></span>
        <span class="tweak-axis">Z</span><button data-step="-0.5">-0.5</button><button data-step="-0.1">-</button><input id="tw-pz" type="number" step="0.1"/><button data-step="0.1">+</button><button data-step="0.5">+0.5</button>
      </div>
      <div class="tweak-row" style="margin-top:6px;">
        <span class="tweak-label">旋转 (°)</span>
        <span class="tweak-axis">X</span><button data-step="-15">-15</button><button data-step="-5">-</button><input id="tw-rx" type="number" step="5"/><button data-step="5">+</button><button data-step="15">+15</button>
      </div>
      <div class="tweak-row">
        <span class="tweak-label"></span>
        <span class="tweak-axis">Y</span><button data-step="-15">-15</button><button data-step="-5">-</button><input id="tw-ry" type="number" step="5"/><button data-step="5">+</button><button data-step="15">+15</button>
      </div>
      <div class="tweak-row">
        <span class="tweak-label"></span>
        <span class="tweak-axis">Z</span><button data-step="-15">-15</button><button data-step="-5">-</button><input id="tw-rz" type="number" step="5"/><button data-step="5">+</button><button data-step="15">+15</button>
      </div>
      <div class="tweak-row" style="margin-top:6px;">
        <span class="tweak-label">缩放</span>
        <span class="tweak-axis">×</span><button data-step="-0.1">-0.1</button><button data-step="-0.05">-</button><input id="tw-s" type="number" step="0.05" min="0.05"/><button data-step="0.05">+</button><button data-step="0.1">+0.1</button>
      </div>
      <div style="font-size:10px;color:#88c87a;margin-top:6px;">
        💡 也可以方向键移动：<kbd>↑↓←→</kbd>=XZ平面平移 0.1，<kbd>PgUp/PgDn</kbd>=Y 升降
      </div>
    </div>

    <h2>4. 导出</h2>
    <div class="row">
      <button id="btn-export" class="ghost">生成 targetOverrides JSON</button>
      <button id="btn-copy" class="ghost" disabled>复制到剪贴板</button>
      <span class="status-msg" id="status-export"></span>
    </div>
    <div class="row" id="export-output" style="display:none;">
      <textarea id="json-output" readonly style="min-height: 180px; font-size: 10px;"></textarea>
      <div class="controls-tip" style="margin-top:6px;">
        把这段粘贴到 main.js 中对应 LEVEL 的 <code style="color:#ffd24a;">targetOverrides</code> 字段。
      </div>
    </div>
  </div>

  <!-- 用 importmap 让 three / three/addons 可被 type=module 解析 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===== Three 场景搭建 =====
    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1816);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
    camera.position.set(5, 4, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    app.appendChild(renderer.domElement);

    // 环境光
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(5, 8, 5);
    scene.add(dir);

    // 网格 + 坐标系参考
    scene.add(new THREE.GridHelper(10, 10, 0x666666, 0x333333));
    scene.add(new THREE.AxesHelper(2));

    // OrbitControls
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 1.5, 0);
    orbit.enableDamping = true;
    orbit.enableZoom = true;
    orbit.zoomSpeed = 1.5;
    orbit.minDistance = 0.05;
    orbit.maxDistance = 1000;
    orbit.enablePan = true;
    orbit.panSpeed = 1.0;

    // TransformControls
    const tc = new TransformControls(camera, renderer.domElement);
    tc.setSize(1.5);
    tc.setMode('translate');
    scene.add(tc);
    tc.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
    tc.addEventListener('change', refreshSelectedRow);

    // 键盘切换 gizmo 模式
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'w' || e.key === 'W') tc.setMode('translate');
      else if (e.key === 'e' || e.key === 'E') tc.setMode('rotate');
      else if (e.key === 'r' || e.key === 'R') tc.setMode('scale');
      else if (e.key === 'x' || e.key === 'X') tc.showX = !tc.showX;
      else if (e.key === 'y' || e.key === 'Y') tc.showY = !tc.showY;
      else if (e.key === 'z' || e.key === 'Z') tc.showZ = !tc.showZ;
      else if (e.key === 'Escape') { tc.detach(); selectedPiece = null; renderPieceList(); syncTweakPanel(); }
    });

    // ===== 状态 =====
    let ghostObj = null;
    const pieces = []; // { name, obj }
    let selectedPiece = null;

    const gltfLoader = new GLTFLoader();

    // ===== UI 工具 =====
    function status(elemId, msg, isErr = false) {
      const el = document.getElementById(elemId);
      el.textContent = msg;
      el.className = 'status-msg' + (isErr ? ' status-err' : '');
    }

    function renderPieceList() {
      const ui = document.getElementById('piece-list-ui');
      ui.innerHTML = '';
      pieces.forEach((p) => {
        const row = document.createElement('div');
        const isSelected = selectedPiece === p;
        const isVisible = p.obj.visible;
        row.className = 'piece-row' + (isSelected ? ' selected' : '') + (!isVisible ? ' hidden-piece' : '');
        row.dataset.pieceName = p.name;

        const pos = p.obj.position;
        const scl = p.obj.scale;
        row.innerHTML = `
          <span class="eye" data-action="toggle" title="${isVisible ? '点击隐藏' : '已隐藏，点击显示'}">${isVisible ? '👁' : '○'}</span>
          <span class="name" data-action="select">${p.name}</span>
          <span class="pos" data-piece="${p.name}">
            pos(${pos.x.toFixed(2)},${pos.y.toFixed(2)},${pos.z.toFixed(2)}) s(${scl.x.toFixed(2)})
          </span>
        `;
        ui.appendChild(row);
      });
    }

    // 事件委托——只注册一次，避免 renderPieceList 期间 mousedown/mouseup 错位
    document.getElementById('piece-list-ui').addEventListener('click', (e) => {
      const row = e.target.closest('.piece-row');
      if (!row) return;
      const name = row.dataset.pieceName;
      const p = pieces.find(x => x.name === name);
      if (!p) return;

      const action = e.target.dataset.action;
      if (action === 'toggle') {
        p.obj.visible = !p.obj.visible;
        if (!p.obj.visible && selectedPiece === p) { tc.detach(); selectedPiece = null; syncTweakPanel(); }
        else if (p.obj.visible) selectPiece(p);
        renderPieceList();
      } else {
        // 默认行为：显示 + 选中 + 相机对准
        p.obj.visible = true;
        selectPiece(p);
        focusCameraOn(p.obj);
      }
    });

    // 选中零件时把相机看向它，确保 gizmo 就在屏幕中央可操作
    function focusCameraOn(obj) {
      const target = new THREE.Vector3();
      obj.getWorldPosition(target);
      // 用 box 计算合适距离，避免零件比例特别大或特别小时相机靠太近/太远
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);
      const radius = Math.max(size.x, size.y, size.z, 1) * 0.9;

      orbit.target.copy(target);
      const dir = new THREE.Vector3().subVectors(camera.position, target).normalize();
      if (dir.lengthSq() < 0.001) dir.set(1, 0.5, 1).normalize();
      camera.position.copy(target).addScaledVector(dir, radius * 3);
      orbit.update();
    }

    function refreshSelectedRow() {
      if (!selectedPiece) return;
      const span = document.querySelector(`.pos[data-piece="${CSS.escape(selectedPiece.name)}"]`);
      if (span) {
        const pos = selectedPiece.obj.position;
        const scl = selectedPiece.obj.scale;
        span.textContent = `pos(${pos.x.toFixed(2)},${pos.y.toFixed(2)},${pos.z.toFixed(2)}) s(${scl.x.toFixed(2)})`;
      }
    }

    function selectPiece(p) {
      selectedPiece = p;
      tc.attach(p.obj);
      orbit.enabled = true;
      renderPieceList();
      syncTweakPanel();
    }

    // ===== 精调面板：数值输入 / 步进按钮 / 方向键 =====
    function syncTweakPanel() {
      const panel = document.getElementById('tweak-panel');
      if (!selectedPiece) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      const obj = selectedPiece.obj;
      document.getElementById('tw-px').value = +obj.position.x.toFixed(3);
      document.getElementById('tw-py').value = +obj.position.y.toFixed(3);
      document.getElementById('tw-pz').value = +obj.position.z.toFixed(3);
      document.getElementById('tw-rx').value = +(THREE.MathUtils.radToDeg(obj.rotation.x)).toFixed(1);
      document.getElementById('tw-ry').value = +(THREE.MathUtils.radToDeg(obj.rotation.y)).toFixed(1);
      document.getElementById('tw-rz').value = +(THREE.MathUtils.radToDeg(obj.rotation.z)).toFixed(1);
      document.getElementById('tw-s').value  = +obj.scale.x.toFixed(3);
    }

    // 输入框 → 物体 transform
    function bindInput(id, applier) {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        if (!selectedPiece) return;
        const v = parseFloat(el.value);
        if (Number.isNaN(v)) return;
        applier(selectedPiece.obj, v);
        refreshSelectedRow();
      });
    }
    bindInput('tw-px', (o, v) => { o.position.x = v; });
    bindInput('tw-py', (o, v) => { o.position.y = v; });
    bindInput('tw-pz', (o, v) => { o.position.z = v; });
    bindInput('tw-rx', (o, v) => { o.rotation.x = THREE.MathUtils.degToRad(v); });
    bindInput('tw-ry', (o, v) => { o.rotation.y = THREE.MathUtils.degToRad(v); });
    bindInput('tw-rz', (o, v) => { o.rotation.z = THREE.MathUtils.degToRad(v); });
    bindInput('tw-s',  (o, v) => { if (v > 0) o.scale.set(v, v, v); });

    // 步进按钮：+/- 方向数值
    document.getElementById('tweak-panel').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      const step = parseFloat(e.target.dataset.step);
      if (Number.isNaN(step) || !selectedPiece) return;
      // 找同 row 的 input
      const row = e.target.closest('.tweak-row');
      const input = row.querySelector('input');
      if (!input) return;
      input.value = (parseFloat(input.value || 0) + step).toFixed(3);
      input.dispatchEvent(new Event('input'));
    });

    // 方向键 / PageUp / PageDown 微调
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!selectedPiece) return;
      const obj = selectedPiece.obj;
      const step = e.shiftKey ? 0.5 : 0.1;
      let used = false;
      if (e.key === 'ArrowLeft')      { obj.position.x -= step; used = true; }
      else if (e.key === 'ArrowRight'){ obj.position.x += step; used = true; }
      else if (e.key === 'ArrowUp')   { obj.position.z -= step; used = true; }
      else if (e.key === 'ArrowDown') { obj.position.z += step; used = true; }
      else if (e.key === 'PageUp')    { obj.position.y += step; used = true; }
      else if (e.key === 'PageDown')  { obj.position.y -= step; used = true; }
      if (used) {
        e.preventDefault();
        syncTweakPanel();
        refreshSelectedRow();
      }
    });

    // 自适应路径：本地从 /tools/calibrator.html 启动用 ..，部署到根用 .
    const BASE_PATH = window.location.pathname.includes('/tools/') ? '..' : '.';
    function resolveUrl(p) {
      if (!p.startsWith('/')) return p;
      return BASE_PATH + p;
    }

    document.getElementById('btn-load-ghost').addEventListener('click', () => {
      const path = document.getElementById('ghost-path').value.trim();
      if (!path) { status('status-ghost', '请填写路径', true); return; }

      if (ghostObj) { scene.remove(ghostObj); ghostObj = null; }

      status('status-ghost', '加载中…');
      const url = resolveUrl(path);
      gltfLoader.load(url, (gltf) => {
        const m = gltf.scene;
        m.position.set(0, 0, 0);
        // 半透明 + 暗色调，作为参照
        m.traverse((node) => {
          if (node.isMesh && node.material) {
            node.material = node.material.clone();
            node.material.transparent = true;
            node.material.opacity = 0.45;
            node.material.depthWrite = false;
          }
        });
        ghostObj = m;
        scene.add(ghostObj);
        status('status-ghost', `✅ 成品已加载（半透明显示）`);
      }, undefined, (err) => {
        console.error(err);
        status('status-ghost', `加载失败：${err.message || err}`, true);
      });
    });

    document.getElementById('btn-load-pieces').addEventListener('click', async () => {
      const names = document.getElementById('piece-list').value.split('\n').map(s => s.trim()).filter(Boolean);
      const prefix = document.getElementById('piece-prefix').value.trim();
      if (names.length === 0) { status('status-pieces', '请填写零件名', true); return; }

      // 清空现有
      pieces.forEach(p => scene.remove(p.obj));
      pieces.length = 0;
      selectedPiece = null;
      tc.detach();
      renderPieceList();

      const keepOriginal = document.getElementById('keep-glb-position').checked;
      status('status-pieces', '加载中…');
      let loaded = 0, failed = 0;

      for (let i = 0; i < names.length; i++) {
        const name = names[i];
        const path = prefix + name + '.glb';
        const url = resolveUrl(path);

        try {
          const gltf = await new Promise((res, rej) => gltfLoader.load(url, res, undefined, rej));
          const obj = gltf.scene;
          if (!keepOriginal) {
            const angle = (i / names.length) * Math.PI * 2;
            obj.position.set(Math.cos(angle) * 2, 1.5, Math.sin(angle) * 2);
          }
          obj.visible = false;
          scene.add(obj);
          pieces.push({ name, obj });
          loaded++;
        } catch (err) {
          console.warn(`零件 ${name} 加载失败:`, err);
          failed++;
        }
      }
      const tip = keepOriginal && loaded > 0 ? ' · 已保留 GLB 自带位置' : '';
      status('status-pieces', `✅ 已加载 ${loaded} 个零件${failed ? `（${failed} 个失败）` : ''}${tip}`);
      renderPieceList();
    });

    // 切换成品参照可见性（按钮 + G 键）
    function toggleGhost() {
      if (!ghostObj) { status('status-ghost', '请先加载成品参照', true); return; }
      ghostObj.visible = !ghostObj.visible;
      document.getElementById('btn-toggle-ghost').textContent = ghostObj.visible ? '隐藏成品 (G)' : '显示成品 (G)';
      status('status-ghost', ghostObj.visible ? '✅ 成品已显示' : '👁 成品已隐藏（用于肉眼判断对齐）');
    }
    document.getElementById('btn-toggle-ghost').addEventListener('click', toggleGhost);
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'g' || e.key === 'G') toggleGhost();
    });

    document.getElementById('btn-show-all').addEventListener('click', () => {
      pieces.forEach(p => { p.obj.visible = true; });
      renderPieceList();
    });
    document.getElementById('btn-hide-all').addEventListener('click', () => {
      pieces.forEach(p => { p.obj.visible = false; });
      tc.detach(); selectedPiece = null;
      renderPieceList();
      syncTweakPanel();
    });
    // 仅显示选中（其他全隐藏，方便单独操作）
    document.getElementById('btn-isolate').addEventListener('click', () => {
      if (!selectedPiece) { status('status-pieces', '请先点名字选中一个零件', true); return; }
      pieces.forEach(p => { p.obj.visible = (p === selectedPiece); });
      renderPieceList();
    });
    // 把选中零件挪到工作台位置
    document.getElementById('btn-park').addEventListener('click', () => {
      if (!selectedPiece) { status('status-pieces', '请先点名字选中一个零件', true); return; }
      selectedPiece.obj.position.set(5, 2, 0);
      renderPieceList();
    });
    // 把选中零件归零（粗对齐到成品中心）
    document.getElementById('btn-origin').addEventListener('click', () => {
      if (!selectedPiece) { status('status-pieces', '请先点名字选中一个零件', true); return; }
      selectedPiece.obj.position.set(0, 0, 0);
      renderPieceList();
    });

    // ===== 导出 =====
    document.getElementById('btn-export').addEventListener('click', () => {
      if (pieces.length === 0) { status('status-export', '没有可导出的零件', true); return; }

      const overrides = {};
      pieces.forEach(p => {
        const pos = p.obj.position;
        const q = p.obj.quaternion;
        const scl = p.obj.scale;
        const entry = {
          position: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) },
          quaternion: { x: +q.x.toFixed(4), y: +q.y.toFixed(4), z: +q.z.toFixed(4), w: +q.w.toFixed(4) },
        };
        // 只在非均匀 1.0 时记录 scale
        if (Math.abs(scl.x - 1) > 0.001 || Math.abs(scl.y - 1) > 0.001 || Math.abs(scl.z - 1) > 0.001) {
          entry.scale = { x: +scl.x.toFixed(4), y: +scl.y.toFixed(4), z: +scl.z.toFixed(4) };
        }
        overrides[p.name] = entry;
      });

      const code = `targetOverrides: ${JSON.stringify(overrides, null, 2)},`;
      document.getElementById('json-output').value = code;
      document.getElementById('export-output').style.display = 'block';
      document.getElementById('btn-copy').disabled = false;
      status('status-export', `✅ 已生成 ${pieces.length} 个零件的配置（含位置/旋转/缩放）`);
    });

    document.getElementById('btn-copy').addEventListener('click', () => {
      const ta = document.getElementById('json-output');
      ta.select();
      try {
        navigator.clipboard.writeText(ta.value).then(() => {
          status('status-export', '✅ 已复制到剪贴板');
        });
      } catch (e) {
        document.execCommand('copy');
        status('status-export', '✅ 已复制到剪贴板');
      }
    });

    // ===== 渲染循环 =====
    function animate() {
      requestAnimationFrame(animate);
      orbit.update();
      renderer.render(scene, camera);
    }
    animate();
    console.log('[Calibrator] 初始化完成 ✅');

    // 全局错误捕获——把致命错误打到屏幕上而不是只在控制台
    window.addEventListener('error', (e) => {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:8px;font-size:12px;z-index:9999;font-family:monospace;';
      banner.textContent = `❌ JS 错误：${e.message} (${e.filename}:${e.lineno})`;
      document.body.appendChild(banner);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
