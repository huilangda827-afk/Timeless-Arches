<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万象图鉴 · 拾光筑梦</title>
  <link rel="icon" href="/images/brand/logo-dougong.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/catalog2/catalog2.css" />
</head>
<body>

  <!-- 顶部导航（与新门户同款） -->
  <header class="nav">
    <a class="nav-logo" href="/home2.html">
      <img class="nav-mark" src="/images/brand/logo-dougong.svg" alt="拾光筑梦" />
      <span class="nav-word">
        <b>拾光筑梦</b>
        <em>TIMELESS ARCHES</em>
      </span>
    </a>
    <nav class="nav-links">
      <a href="/home2.html">首页</a>
      <a class="on" href="/catalog2.html">万象图鉴</a>
      <a href="/map2.html">古建舆图</a>
      <a href="/view2.html">鉴赏</a>
      <a href="/forge.html">筑梦</a>
      <a href="/arcade.html">游艺坊</a>
      <a href="/collection2.html">藏宝阁</a>
    </nav>
  </header>

  <!-- 页头 -->
  <section class="head">
    <h1>万象图鉴</h1>
    <p class="head-sub">现藏三维古建 <b id="total-count">15</b> 座 —— 民居 · 官府 · 皇宫 · 祠庙，一览千年木构</p>

    <!-- 工具行：搜索 + 舆图跳转 -->
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16 L21.5 21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" placeholder="搜索古建：名称 / 朝代 / 地域 / 斗拱形制…" />
      </div>
      <a class="map-jump" href="/map2.html" title="进入古建舆图">
        <span class="mj-icon">舆</span>
        <span class="mj-text"><b>古建舆图</b><em>按图索骥 · 地域分布</em></span>
        <span class="mj-arrow">→</span>
      </a>
    </div>

    <!-- 类别筛选 -->
    <div class="chips" id="chips"></div>
  </section>

  <!-- 卡片网格 -->
  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" hidden>未找到匹配的古建 —— 换个关键词试试</div>

  <footer class="footer">
    拾光筑梦 · 万象图鉴 — Demo 预览版
    <em>所载建筑均为项目已完成三维数字化的真实古建</em>
  </footer>

  <!-- 建筑详情弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask" id="modal-mask"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="关闭">✕</button>
      <div class="modal-img"><img id="m-img" src="" alt="" /></div>
      <div class="modal-body">
        <div class="m-kicker" id="m-category">皇家园林</div>
        <h2 id="m-name">建筑名</h2>
        <div class="m-meta"><span id="m-era"></span><i>·</i><span id="m-location"></span></div>
        <div class="m-keyword" id="m-keyword"></div>
        <p class="m-desc" id="m-desc"></p>
        <div class="m-actions" id="m-actions"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/catalog2/catalog2-main.js"></script>
</body>
</html>
